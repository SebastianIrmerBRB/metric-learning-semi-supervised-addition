# Publishes the data viewer (viewer/) over thesis_generator/daten on GitHub Pages.
# The figures and tables are regenerated from the data on every run, so the Figures page always shows what the
# committed generators produce.
name: Datenansicht

on:
  push:
    branches: [main]
    paths:
      - "thesis_generator/**"
      - "viewer/**"
      - ".github/workflows/datenansicht.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thesis_generator/requirements-getestet.txt
      - name: Install the tested generator dependencies
        run: pip install -r thesis_generator/requirements-getestet.txt
      - name: Generate all figures and tables from the data
        run: python thesis_generator/generate.py --output "$RUNNER_TEMP/ausgabe"
      - name: Build the static viewer
        env:
          SITE_LABEL: "thesis_generator/daten @ ${{ github.sha }}"
        run: python viewer/build_site.py --data thesis_generator/daten --ausgabe "$RUNNER_TEMP/ausgabe" --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
